<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find my sound — FindYourSound</title>
  <meta name="description" content="Start the FindYourSound quiz and take the first step toward your sound.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="form-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">FindYourSound</a>
      <a class="nav-cta nav-cta-ghost" href="../index.html">Home</a>
    </div>
  </header>

  <main class="form-main">
    <div class="form-panel">
      <p class="brand-mark">FindYourSound</p>
      <h1>Find my sound</h1>
      <p class="form-intro">Tell us a little about you. Submit to confirm you’re in—full quiz questions are coming soon.</p>

      <form class="lead-form" action="thank-you.html" method="get">
        <label for="name">Your first name</label>
        <input id="name" name="name" type="text" autocomplete="given-name" required placeholder="Alex">

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@email.com">

        <fieldset>
          <legend>What are you looking for?</legend>
          <label class="choice">
            <input type="radio" name="goal" value="tone" required>
            Help finding my tone
          </label>
          <label class="choice">
            <input type="radio" name="goal" value="persona">
            Discover my musician persona
          </label>
          <label class="choice">
            <input type="radio" name="goal" value="build">
            Get ready to build my guitar
          </label>
        </fieldset>

        <button class="btn btn-primary" type="submit">Find my sound</button>
      </form>
    </div>
  </main>
</body>
</html>
