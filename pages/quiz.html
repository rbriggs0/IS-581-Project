<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find my sound — FindYourSound</title>
  <meta name="description" content="Pick your music style and guitar type to get matched with pre-made guitars.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="form-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">FindYourSound</a>
      <a class="nav-cta nav-cta-ghost" href="../index.html">Home</a>
    </div>
  </header>

  <main class="form-main">
    <div class="form-panel">
      <p class="brand-mark">FindYourSound</p>
      <h1>Find my sound</h1>
      <p class="form-intro">Two questions: pick your music style and whether you want acoustic, electric, or either. We’ll match you with pre-made guitars from our curated list.</p>

      <form class="lead-form" id="style-quiz" action="results.html" method="get">
        <fieldset>
          <legend>What music style fits you best?</legend>
          <label class="choice">
            <input type="radio" name="style" value="rock" required>
            Rock
          </label>
          <label class="choice">
            <input type="radio" name="style" value="blues">
            Blues
          </label>
          <label class="choice">
            <input type="radio" name="style" value="jazz">
            Jazz
          </label>
          <label class="choice">
            <input type="radio" name="style" value="folk">
            Folk
          </label>
          <label class="choice">
            <input type="radio" name="style" value="metal">
            Metal
          </label>
          <label class="choice">
            <input type="radio" name="style" value="country">
            Country
          </label>
        </fieldset>

        <fieldset>
          <legend>Acoustic or electric?</legend>
          <label class="choice">
            <input type="radio" name="type" value="acoustic" required>
            Acoustic
          </label>
          <label class="choice">
            <input type="radio" name="type" value="electric">
            Electric
          </label>
          <label class="choice">
            <input type="radio" name="type" value="either">
            Either / not sure
          </label>
        </fieldset>

        <button class="btn btn-primary" type="submit">See my matches</button>
      </form>
    </div>
  </main>
</body>
</html>
