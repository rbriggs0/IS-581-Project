<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your matches — FindYourSound</title>
  <meta name="description" content="Pre-made guitar matches based on your style, type, and experience level.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="form-page results-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">FindYourSound</a>
      <a class="nav-cta" href="quiz.html">Find my sound</a>
    </div>
  </header>

  <main class="results-main">
    <div class="container results-wrap">
      <p class="section-eyebrow">Your matches</p>
      <h1 id="results-heading">Guitars for your sound</h1>
      <p id="results-lead" class="section-lead">Starter matches from our curated list of pre-made guitars—not a custom build.</p>

      <div id="results-status" class="results-status" role="status" aria-live="polite">Loading matches…</div>
      <ul id="results-list" class="results-list" hidden></ul>

      <div class="results-actions">
        <a class="btn btn-primary" href="quiz.html">Try again</a>
        <a class="text-link" href="../index.html">Back home</a>
      </div>
      <p class="results-note">Claiming a match to purchase will need a signup later. For now, browse freely.</p>
    </div>
  </main>

  <script type="module">
    import {
      getMatches,
      loadGear,
      STYLE_LABELS,
      TYPE_LABELS,
      LEVEL_LABELS,
    } from "../js/match.js";

    const params = new URLSearchParams(window.location.search);
    const style = (params.get("style") || "").toLowerCase();
    const typeRaw = (params.get("type") || "either").toLowerCase();
    const levelRaw = (params.get("level") || "either").toLowerCase();
    const type = typeRaw in TYPE_LABELS ? typeRaw : "either";
    const level = levelRaw in LEVEL_LABELS ? levelRaw : "either";

    const heading = document.getElementById("results-heading");
    const lead = document.getElementById("results-lead");
    const status = document.getElementById("results-status");
    const list = document.getElementById("results-list");

    function renderCards(matches) {
      list.innerHTML = matches
        .map(
          (item) => `
        <li class="result-card">
          <p class="result-brand">${escapeHtml(item.brand)}</p>
          <h2 class="result-name">${escapeHtml(item.name)}</h2>
          <p class="result-meta">${escapeHtml(item.type)} · ${escapeHtml(item.priceBand)}</p>
          <p class="result-blurb">${escapeHtml(item.blurb)}</p>
        </li>`
        )
        .join("");
      list.hidden = false;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function init() {
      if (!style || !(style in STYLE_LABELS)) {
        heading.textContent = "Pick your preferences first";
        lead.textContent =
          "Choose a music style, guitar type, and experience level on the quiz to see matches.";
        status.innerHTML = `<a class="btn btn-primary" href="quiz.html">Take the quiz</a>`;
        return;
      }

      const styleLabel = STYLE_LABELS[style];
      const typeLabel = TYPE_LABELS[type];
      const levelLabel = LEVEL_LABELS[level];
      const typePhrase =
        type === "either" ? "acoustic or electric" : typeLabel.toLowerCase();
      const levelPhrase =
        level === "either" ? "any experience level" : levelLabel.toLowerCase();

      heading.textContent = `${styleLabel} · ${typeLabel} · ${levelLabel}`;
      lead.textContent = `Pre-made ${typePhrase} matches for ${levelPhrase}, tagged for ${styleLabel.toLowerCase()}. Scroll if there are several.`;

      try {
        const gear = await loadGear();
        const matches = getMatches(gear, { style, type, level });
        if (!matches.length) {
          status.textContent =
            "No guitars in our list for that combo yet. Try Any level / not sure, Either / not sure, or a different style.";
          return;
        }
        status.textContent = `${matches.length} match${matches.length === 1 ? "" : "es"}`;
        renderCards(matches);
      } catch (err) {
        console.error(err);
        status.textContent =
          "Couldn’t load gear data. If you opened this as a local file, use a local server or GitHub Pages so the JSON can load.";
      }
    }

    init();
  </script>
</body>
</html>
