name: Live site smoke test

on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SITE: https://rbriggs0.github.io/IS-581-Project
    steps:
      - name: Wait for Pages CDN
        run: sleep 60

      - name: Key pages and data return 200
        run: |
          set -e
          for path in / /pages/quiz.html /pages/results.html \
                      /data/gear.json /data/gear-extras.json /data/artists.json \
                      /js/match.js /js/errors.js /js/sanitize.js /styles.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$path")
            echo "$code $path"
            test "$code" = "200"
          done

      - name: Catalog JSON parses and has 27 guitars
        run: |
          count=$(curl -s "$SITE/data/gear.json" | jq 'length')
          echo "gear count: $count"
          test "$count" -ge 27

      - name: Security meta tags present on home and quiz
        run: |
          set -e
          for path in / /pages/quiz.html; do
            html=$(curl -s "$SITE$path")
            echo "$html" | grep -q 'http-equiv="Content-Security-Policy"'
            echo "$html" | grep -q 'name="referrer"'
            echo "$html" | grep -q 'http-equiv="Permissions-Policy"'
            echo "ok $path"
          done

      - name: Open or update smoke-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WHEN="$(date -u +"%Y-%m-%d %H:%M UTC")"
          BODY="## Live site smoke test failed

          The automated smoke workflow failed. Treat this as a SEV1 until the live site is confirmed healthy.

          - **Run:** ${RUN_URL}
          - **Site:** ${SITE}
          - **When:** ${WHEN}

          Follow https://github.com/${{ github.repository }}/blob/main/docs/RUNBOOK-smoke.md"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search 'in:title "SEV1: Live site smoke test failed" is:open' \
            --json number --jq '.[0].number // empty' || true)
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${{ github.repository }}" --body "${BODY}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "SEV1: Live site smoke test failed" \
              --body "${BODY}" \
              --label "smoke-failure" \
            || gh issue create --repo "${{ github.repository }}" \
              --title "SEV1: Live site smoke test failed" \
              --body "${BODY}"
          fi
